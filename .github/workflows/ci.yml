# App CI — the coworker lint/type/test gates, the GUI unit tests, and the hermetic
# Playwright e2e suite (mocked /v1 + WS; no model or network needed).
#
# Python toolchain is uv: `uv sync --locked` installs exactly what uv.lock pins, so a
# green run here reproduces on any machine with `uv sync`.

name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra messaging --extra bedrock
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      # The layering in ARCHITECTURE.md as a gate: fails on a new import-time cycle or a
      # new upward import, and also when a grandfathered one is fixed but left listed.
      - name: Import layering
        run: uv run python scripts/import_graph.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra messaging --extra bedrock
      - name: Test with coverage
        # -n auto: one worker per core. pytest-cov collects per worker and combines,
        # so the coverage number is the same as a serial run.
        run: uv run pytest tests -q -n auto --cov=coworker --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Typecheck
        working-directory: surfaces/gui
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: surfaces/gui
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: surfaces/gui
        run: npm run e2e
